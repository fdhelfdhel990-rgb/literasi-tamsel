services:
  - type: web
    name: literasi-tamsel
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: Literasi Tamsel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: FRONTEND_DATA_SOURCE
        value: database
      - key: ENABLE_ADMIN_DEMO
        value: "false"
      - key: DB_CONNECTION
        value: mysql_aiven
      - key: AIVEN_DB_HOST
        sync: false
      - key: AIVEN_DB_PORT
        value: "3306"
      - key: AIVEN_DB_DATABASE
        sync: false
      - key: AIVEN_DB_USERNAME
        sync: false
      - key: AIVEN_DB_PASSWORD
        sync: false
      - key: AIVEN_MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
